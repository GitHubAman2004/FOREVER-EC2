# Nginx "reverse proxy" for the backend.
# Nginx listens on port 80/443 (the public web ports) and passes every request
# to the Node app running privately on 127.0.0.1:4000.
#
# copy to:   /etc/nginx/sites-available/forever-api
# then:      sudo ln -s /etc/nginx/sites-available/forever-api /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
# HTTPS:     certbot adds the 443 / certificate lines to this file for you

server {
    listen 80;
    # replace with your domain, e.g. forever-api.duckdns.org (keep "_" until you have one)
    server_name _;

    # product images are uploaded through the admin panel; Nginx's default limit is 1 MB
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # chatbot answers (Gemini + Groq) can take a few seconds
        proxy_read_timeout 60s;
    }
}
